name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check hack_evm/ tests/

      - name: Check formatting with Black
        run: |
          black --check hack_evm/ tests/

      - name: Type check with mypy
        run: |
          mypy hack_evm/

      - name: Test with pytest
        run: |
          pytest --cov=hack_evm --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  verify-satire:
    name: Verify Package is Satire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          pip install -e .

      - name: Verify package is importable
        run: |
          python -c "import hack_evm; print(f'Version: {hack_evm.__version__}')"

      - name: Verify no real hacking
        run: |
          python -c "
          import hack_evm
          result = hack_evm.hack()
          assert result['status'] == 'failed', 'Package might actually work!'
          print('✓ Package fails as expected. Satire confirmed.')
          "

      - name: Verify CLI works
        run: |
          hack-evm --version
          hack-evm hack
          hack-evm quantum
          hack-evm conspiracy --level 42

      - name: Final verification
        run: |
          python -c "
          from pathlib import Path
          readme = Path('README.md').read_text()
          assert 'SATIRE' in readme.upper()
          assert 'DISCLAIMER' in readme.upper()
          assert 'no real' in readme.lower() or 'no actual' in readme.lower()
          print('✓ README properly disclaimers. All good!')
          "