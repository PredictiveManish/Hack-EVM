[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hack-evm"
version = "0.1.0"
description = "Advanced EVM Hacking Toolkit - Now with 100% more satire!"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Manish Tiwari", email = "manish.tiwari.09@zohomail.in"}
]
keywords = ["evm", "hacking", "satire", "parody", "election", "quantum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]

[project.scripts]
hack-evm = "hack_evm.cli:main"

[project.urls]
Homepage = "https://github.com/predictivemanish/hack-evm"
"Bug Reports" = "https://github.com/predictivemanish/hack-evm/issues"
"Source" = "https://github.com/predictivemanish/hack-evm"

[tool.setuptools.packages.find]
include = ["hack_evm*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
